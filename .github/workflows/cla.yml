# Contributor licence agreement gate.
#
# Runs in the PUBLIC mirror (3eAI-Labs/nats-bpm-channels), which is where issues and pull
# requests are handled. The document it points at is CLA.md in that same repository.
#
# Signatures are stored in a SEPARATE repository, not in this one, and that is not a preference:
# this repository is re-published as a single squashed snapshot per release, as CONTRIBUTING.md
# describes, so any file the bot committed between releases would be destroyed by the next
# publish. Remote storage is the only placement that survives it.
#
# Two things must exist before this workflow can work, and both are repository settings rather
# than code:
#   1. a repository 3eAI-Labs/cla-signatures (may be private) to hold the signature file;
#   2. a PERSONAL_ACCESS_TOKEN secret in 3eAI-Labs/nats-bpm-channels, which is what lets the
#      action write to that other repository. Use a FINE-GRAINED token scoped to cla-signatures
#      alone, with Contents: read and write — nothing else. A classic `repo`-scope token would
#      hand this third-party action write access to every repository the token owner can reach.
# Until both are in place every pull request check will fail — which is a hard gate, not a soft
# warning, so add them before merging this file into the public mirror.
#
# The action is pinned by commit SHA to v2.6.1, its final release. The repository was archived by its
# maintainer in 2025 and is read-only: it still runs, but it will not be patched. The hosted
# alternative is cla-assistant.io, which is what Camunda 7 and CIBSeven use; it needs an OAuth
# authorisation on the GitHub organisation and stores signatures in its own database. If this
# action ever breaks, that is the migration path, and the signature file is portable JSON.

name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read        # 'read' is enough: signatures live in another repository
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check contributor licence agreement
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # Pinned to the commit SHA, not the tag: a tag is mutable, and this step runs on
        # pull_request_target with a token that can write to another repository, so a
        # re-pointed tag would execute attacker-controlled code with those credentials.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08  # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-document: 'https://github.com/3eAI-Labs/nats-bpm-channels/blob/main/CLA.md'
          path-to-signatures: 'signatures/nats-bpm-channels/v1.json'
          remote-organization-name: '3eAI-Labs'
          remote-repository-name: 'cla-signatures'
          branch: 'main'
          # Maintainers and bots. Bots cannot accept an agreement at all, so they have to be here.
          allowlist: leventg,bot*
          custom-notsigned-prcomment: >
            Thank you for the pull request. Before it can be merged, please read the
            [3eAI Labs Contributor Licence Agreement](https://github.com/3eAI-Labs/nats-bpm-channels/blob/main/CLA.md)
            and accept it by posting the sentence below as a comment on this pull request. You keep
            the copyright in what you write; section 2 explains what you are granting. You only do
            this once.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have accepted the CLA. Thank you.'
